# The minimal theme: what a package must carry and nothing else. Every optional
# field takes its default, and the palette is generated from the seed below.
# `scripts/publish.sh serverbox.ember <version>` packs this folder into the
# .fsbt and records the version in ../serverbox.ember.toml.
format = 1
id = "serverbox.ember"
name = "Ember"
modes = ["dark"]

[schema]
min = 1
max = 1

[colors]
# Dark from the start: this theme declares one mode, so picking it locks
# ThemeMode rather than leaving the system to decide.
mode = 2
# A warm ember red, from which the whole dark palette is generated.
seed = 0xFFE2603C
